<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brio — under construction</title>
<meta name="description" content="Brio is under construction.">
<meta name="theme-color" content="#1D4436">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2367977F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%231D4436' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Spectral:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F0;        /* Bone */
    --surface: #DBE6DF;   /* Mist */
    --sage: #67977F;      /* Sage — fields only, never text */
    --primary: #1D4436;   /* Bríoch */
    --on-primary: #F7F5F0;
    --text: #0F1A16;      /* Ink */
    --muted: #4E5C56;     /* Slate */
    --accent: #8A5A18;    /* Bronze */
    --critical: #8E2F26;  /* Rust */
    --border: #1D4436;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101815;      /* Night */
      --surface: #17231E;
      --sage: #95C3AB;
      --primary: #95C3AB;
      --on-primary: #101815;
      --text: #EEF2EF;
      --muted: #9FAEA7;
      --accent: #D8A45C;
      --critical: #E28C7B;
      --border: #95C3AB;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font: 400 1rem/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }

  .band { height: 6px; background: var(--sage); }

  .wrap {
    width: 100%;
    max-width: 38rem;
    margin: 0 auto;
    padding: 0 1rem;
  }

  header { padding: 2rem 0 0; }
  .wordmark {
    font-family: Spectral, Georgia, serif;
    font-weight: 500;
    font-size: 1.75rem;
    letter-spacing: 0.01em;
    color: var(--primary);
    text-decoration: none;
  }

  main { flex: 1; display: flex; align-items: center; padding: 3rem 0; }

  .eyebrow {
    display: inline-block;
    margin: 0 0 1.25rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1 {
    margin: 0;
    font-family: Spectral, Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.25rem, 7vw, 3.5rem);
    line-height: 1.08;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .tagline {
    margin: 0.5rem 0 0;
    font-family: Spectral, Georgia, serif;
    font-size: clamp(1.35rem, 4vw, 1.75rem);
    line-height: 1.25;
    color: var(--primary);
  }
  .about {
    margin: 1.75rem 0 0;
    max-width: 34rem;
    color: var(--muted);
  }

  a { color: var(--primary); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  footer {
    padding: 1.5rem 0 2rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer a { color: var(--muted); }

</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>

<header class="wrap">
  <a class="wordmark" href="/" aria-label="Brio home">brio</a>
</header>

<main class="wrap">
  <div>
    <p class="eyebrow">Under construction</p>
    <h1>Brio is under construction.</h1>
    <p class="tagline">We'll be back with a bang.</p>

    <p class="about">
      Brio brings your training, recovery and nutrition data together, then recommends
      one bounded next step for your next session, with the evidence behind it.
      You make the final call.
    </p>

  </div>
</main>

<footer class="wrap">
  © 2026 Brio · <a href="https://thegregslist.com">thegregslist.com</a>
</footer>

</body>
</html>
