services:
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - dokploy-network
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "3000"
    networks:
      - dokploy-network
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
