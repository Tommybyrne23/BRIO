services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brioweb
      POSTGRES_PASSWORD: brioweb
      POSTGRES_DB: brioweb
    ports:
      - "5432:5432"
    volumes:
      - brioweb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brioweb -d brioweb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  brioweb_pg_data:
